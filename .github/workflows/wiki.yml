name: wiki

# 静态站点：只构建、不跑服务器。PR 上只校验（check-wiki.py + build --strict），
# main 上（push 或手动 dispatch）发布到 GitHub Pages。
# 首次启用：仓库 Settings → Pages → Source 选 "GitHub Actions"。

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "wiki/**"
      - "mkdocs.yml"
      - "requirements-wiki.txt"
      - "scripts/check-wiki.py"
      - ".github/workflows/wiki.yml"
  pull_request:
    paths:
      - "wiki/**"
      - "mkdocs.yml"
      - "requirements-wiki.txt"
      - "scripts/check-wiki.py"
      - ".github/workflows/wiki.yml"

permissions:
  contents: read

concurrency:
  group: wiki-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-wiki.txt

      - name: Install site deps
        run: pip install -r requirements-wiki.txt

      - name: Wiki guard
        run: python3 scripts/check-wiki.py

      - name: Build site (strict)
        run: mkdocs build --strict

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
