name: neo-spike

on:
  workflow_dispatch:
  push:
    branches: ["spike/neoforge-1.21.1"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Publish log on failure
        if: failure()
        run: |
          git config user.name "ci"
          git config user.email "ci@exnihilo.local"
          git checkout -B ci-logs
          mkdir -p .ci
          tail -c 200000 /tmp/build.log > .ci/build.log
          git add -f .ci/build.log
          git commit -m "ci: neoforge spike build log" || true
          git push -f origin ci-logs
