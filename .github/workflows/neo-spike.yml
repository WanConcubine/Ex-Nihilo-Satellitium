name: build

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    paths:
      - "src/**"
      - "scripts/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/neo-spike.yml"

# The job only reads the repo and uploads a log artifact; it must never push.
permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Cheap guards first so a bad data path / resource fails before the
      # 10-minute compile. Keep this list in sync with AGENTS.md §2.
      - name: Texture guard
        run: python3 scripts/check-textures.py

      - name: Core purity guard
        run: python3 scripts/check-core-imports.py

      - name: Data layout guard
        run: python3 scripts/check-data-paths.py

      - name: Wiki guard
        run: python3 scripts/check-wiki.py

      - name: Compile
        run: ./gradlew build --no-daemon --stacktrace

      - name: Headless server smoke
        run: |
          set -u
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nlevel-type=flat\nspawn-protection=0\n' > run/server.properties

          # setsid gives the job its own process group, so the final kill also
          # reaches the Minecraft server that Gradle launches as a child.
          setsid ./gradlew runServer --no-daemon > /tmp/server.log 2>&1 &
          GRADLE_PID=$!

          for i in $(seq 1 180); do
            if grep -qF "Done (" /tmp/server.log; then break; fi
            if ! kill -0 "$GRADLE_PID" 2>/dev/null; then break; fi
            sleep 5
          done

          echo "--- markers ---"
          grep -E "Done \(|\[materials\] loaded|Starting minecraft server" /tmp/server.log | tail -10 || true

          # setsid should have made GRADLE_PID its own process-group leader, so
          # killing the group also reaches the server Gradle launched. If the
          # session was not created (unusual container), fall back to the PID and
          # the old name-based kill.
          if [ "$(ps -o pgid= -p "$GRADLE_PID" 2>/dev/null | tr -d ' ')" = "$GRADLE_PID" ]; then
            kill -- -"$GRADLE_PID" 2>/dev/null || true
          else
            kill "$GRADLE_PID" 2>/dev/null || true
          fi
          pkill -f "net.minecraft.server" 2>/dev/null || true
          wait "$GRADLE_PID" 2>/dev/null || true

          # The material count depends on materials.json (mod-gated `gems`
          # entries are skipped when no supported mod is installed), so compute
          # the expectation instead of hard-coding it.
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import sys

          materials = json.loads(pathlib.Path(
              "src/main/resources/exnihilosatellitium/materials.json"
          ).read_text(encoding="utf-8"))["materials"]

          expected = 0
          for material in materials:
              if not material.get("enabled", True):
                  continue
              if "gems" not in material:
                  expected += 1
                  continue
              # Gems are registered only when a candidate is unconditional or its
              # mod is loaded; the CI server runs without mods.
              if any(candidate.get("mod") is None for candidate in material.get("gems", [])):
                  expected += 1

          log = pathlib.Path("/tmp/server.log").read_text(encoding="utf-8", errors="replace")
          problems = []
          if "Done (" not in log:
              problems.append("server never printed 'Done ('")
          match = re.search(r"\[materials\] loaded (\d+) entries", log)
          if not match:
              problems.append("missing '[materials] loaded N entries' log line")
          elif int(match.group(1)) != expected:
              problems.append(
                  f"[materials] loaded {match.group(1)} entries, expected {expected} "
                  "(enabled non-gem materials + unconditional gems)"
              )
          if problems:
              print("\n".join(problems))
              sys.exit(1)
          print(f"server smoke OK: Done + [materials] {expected} entries")
          PY

      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: /tmp/server.log
          if-no-files-found: ignore
