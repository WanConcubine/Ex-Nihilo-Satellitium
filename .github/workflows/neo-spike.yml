name: build

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile
        run: ./gradlew build --no-daemon --stacktrace

      - name: Texture guard
        run: python3 scripts/check-textures.py

      - name: Headless server smoke
        run: |
          set +e
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nlevel-type=flat\nspawn-protection=0\n' > run/server.properties

          ./gradlew runServer --no-daemon > /tmp/server.log 2>&1 &
          GRADLE_PID=$!

          for i in $(seq 1 180); do
            if grep -qF "Done (" /tmp/server.log; then break; fi
            if ! kill -0 "$GRADLE_PID" 2>/dev/null; then break; fi
            sleep 5
          done

          echo "--- markers ---"
          grep -E "Done \(|\[materials\] loaded|Starting minecraft server" /tmp/server.log | tail -10 || true

          kill "$GRADLE_PID" 2>/dev/null
          pkill -f "net.minecraft.server" 2>/dev/null

          test -n "$(grep -F 'Done (' /tmp/server.log)" \
            && test -n "$(grep -F '[materials] loaded 12 entries' /tmp/server.log)"

      - name: Publish log on failure
        if: failure()
        run: |
          git config user.name "ci"
          git config user.email "ci@exnihilo.local"
          git checkout -B ci-logs
          mkdir -p .ci
          tail -c 200000 /tmp/server.log > .ci/server.log 2>/dev/null || true
          git add -f .ci/server.log 2>/dev/null || true
          git commit -m "ci: spike server log" || true
          git push -f origin ci-logs || true
