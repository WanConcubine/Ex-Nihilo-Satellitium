plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    // 产物名带 MC 版本：exnihilosatellitium-1.20.1-1.1.0.jar（和 1.21.1 线区分）
    archivesName = "${mod_id}-${minecraft_version}"
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Parchment is an unofficial project maintained by ParchmentMC, separate from MinecraftForge
    // Additional setup is needed to use their mappings: https://parchmentmc.org/docs/getting-started
    //
    // Use non-default mappings at your own risk. They may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: mapping_channel, version: mapping_version

    // When true, this property will have all Eclipse/IntelliJ IDEA run configurations run the "prepareX" task for the given run configuration before launching the game.
    // In most cases, it is not necessary to enable.
    // enableEclipsePrepareRuns = true
    // enableIdeaPrepareRuns = true

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    // See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
    copyIdeResources = true

    // When true, this property will add the folder name of all declared run configurations to generated IDE run configurations.
    // The folder name can be set on a run configuration using the "folderName" property.
    // By default, the folder name of a run configuration is the name of the Gradle project containing it.
    // generateRunFolders = true

    // This property enables access transformers for use in development.
    // They will be applied to the Minecraft artifact.
    // The access transformer file can be anywhere in the project.
    // However, it must be at "META-INF/accesstransformer.cfg" in the final mod jar to be loaded by Forge.
    // This default location is a best practice to automatically put the file in the right place in the final jar.
    // See https://docs.minecraftforge.net/en/latest/advanced/accesstransformers/ for more information.
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Production mods loaded from libs/ keep SRG names in their mixin
            // refmaps; remap them to the dev mappings so Jade & co. apply.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')
            // Datagen must still see mod-gated `gems` materials so their assets
            // exist for packs that do install Mekanism/Thermal.
            property 'exnihilosatellitium.datagen', 'true'

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Jade API for the optional HUD plugin. Modrinth mirrors the released jar.
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    // JEI (1.20.1). Compile-only API so the plugin classes build without the mod.
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com"
    }
    // Local production jars for dev testing (libs/ is gitignored). ForgeGradle
    // deobfuscates them, otherwise SRG names break at runtime in the dev client.
    flatDir {
        dirs 'libs'
        dirs 'libs/crafttweaker'
    }
}

// CraftTweaker's BlameJared maven has an intermittent TLS handshake failure with
// Gradle; fetch the compile-time Forge jar with the build JVM and keep it under
// libs/ (gitignored, never shipped).
def crafttweakerJar = file("libs/crafttweaker/CraftTweaker-forge-1.20.1-${crafttweaker_version}.jar")

tasks.register('downloadCraftTweaker') {
    outputs.file(crafttweakerJar)
    doLast {
        if (crafttweakerJar.exists()) {
            return
        }
        crafttweakerJar.parentFile.mkdirs()
        def url = new URL("https://maven.blamejared.com/com/blamejared/crafttweaker/CraftTweaker-forge-1.20.1/${crafttweaker_version}/CraftTweaker-forge-1.20.1-${crafttweaker_version}.jar")
        url.withInputStream { input -> crafttweakerJar.withOutputStream { output -> output << input } }
    }
}

tasks.named('compileJava').configure {
    dependsOn 'downloadCraftTweaker'
}

dependencies {
    // Specify the version of Minecraft to use.
    // Any artifact can be supplied so long as it has a "userdev" classifier artifact and is a compatible patcher artifact.
    // The "userdev" classifier will be requested and setup by ForgeGradle.
    // If the group id is "net.minecraft" and the artifact id is one of ["client", "server", "joined"],
    // then special handling is done to allow a setup of a vanilla dependency without the use of an external repository.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Optional: Jade HUD integration. Never shipped; only needed to compile the plugin.
    compileOnly "maven.modrinth:jade:${jade_version}"

    // Optional KubeJS script API. compileOnly, never shipped; ForgeGradle
    // deobfuscates the mod jars so the plugin can reference Minecraft symbols.
    compileOnly fg.deobf("maven.modrinth:kubejs:${kubejs_version}")
    compileOnly fg.deobf("maven.modrinth:rhino:${rhino_version}")
    compileOnly fg.deobf("ct:CraftTweaker-forge-1.20.1:${crafttweaker_version}")

    // Dev-test mods: production jars from libs/ (gitignored), deobfuscated into
    // the dev runtime. Only with -PdevMods, because they are client-side mods and
    // would break `runServer` (Just Enough Characters even fails on a dedicated
    // server). `./gradlew runClient -PdevMods` is the intended use.
    // JEI API is always needed: the plugin classes live in src/main/java.
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-common-api:15.59.0.212")
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-forge-api:15.59.0.212")

    // KubeJS runtime for the optional script-API integration test. The mod jars
    // are SRG-named, so they must be deobfuscated for the dev server; gated
    // behind -PkjsMods so a normal runServer stays dependency-free.
    //   ./gradlew runServer -PkjsMods
    if (project.hasProperty("ctMods")) {
        runtimeOnly fg.deobf("ct:CraftTweaker-forge-1.20.1:${crafttweaker_version}")
    }

    if (project.hasProperty("kjsMods")) {
        runtimeOnly fg.deobf("maven.modrinth:kubejs:${kubejs_version}")
        runtimeOnly fg.deobf("maven.modrinth:rhino:${rhino_version}")
        runtimeOnly fg.deobf("maven.modrinth:architectury-api:${architectury_version}")
    }

    if (project.hasProperty("devMods")) {
        runtimeOnly fg.deobf("mezz.jei:jei-1.20.1-forge:15.59.0.212")
        if (file("libs/Jade-1.20.1-Forge-11.13.2.jar").exists()) {
            runtimeOnly fg.deobf("libs:Jade-1.20.1-Forge:11.13.2")
        }
        if (file("libs/jecharacters-1.20.1-forge-4.6.11.jar").exists()) {
            runtimeOnly fg.deobf("libs:jecharacters-1.20.1-forge:4.6.11")
        }
    }

    // Supported tech mods for the ingot-candidate integration test (libs/ is
    // gitignored). Gated behind -PtechMods on purpose: `runData` must not see them,
    // otherwise OreMaterials resolves ingots to their items and their own datagen
    // providers would write into our output tree.
    //   ./gradlew runServer -PtechMods      (integration test)
    //   ./gradlew runData                   (datagen, no tech mods)
    // Thermal Foundation needs CoFH Core; Thermal Expansion is only for a realistic pack.
    if (project.hasProperty("techMods") && file("libs/Mekanism-1.20.1-10.4.16.80.jar").exists()) {
        runtimeOnly fg.deobf("libs:Mekanism-1.20.1:10.4.16.80")
    }
    if (project.hasProperty("techMods") && file("libs/cofh_core-1.20.1-11.0.2.56.jar").exists()) {
        runtimeOnly fg.deobf("libs:cofh_core-1.20.1:11.0.2.56")
    }
    if (project.hasProperty("techMods") && file("libs/thermal_foundation-1.20.1-11.0.6.70.jar").exists()) {
        runtimeOnly fg.deobf("libs:thermal_foundation-1.20.1:11.0.6.70")
    }
    if (project.hasProperty("techMods") && file("libs/create-1.20.1-6.0.8.jar").exists()) {
        // Create bundles Flywheel / Ponder / Registrate / MixinExtras as jar-in-jar.
        runtimeOnly fg.deobf("libs:create-1.20.1:6.0.8")
    }
    if (project.hasProperty("techMods") && file("libs/thermal_expansion-1.20.1-11.0.1.29.jar").exists()) {
        // Only for a realistic pack: Foundation's press recipes reference
        // Expansion's press dies, so without it the log fills with Unknown item.
        runtimeOnly fg.deobf("libs:thermal_expansion-1.20.1:11.0.1.29")
    }
    if (project.hasProperty("techMods") && file("libs/ImmersiveEngineering-1.20.1-10.2.0-183.jar").exists()) {
        // IE 10.x is the 1.20.1 line; it has no hard dependencies.
        runtimeOnly fg.deobf("libs:ImmersiveEngineering-1.20.1:10.2.0-183")
    }
    if (project.hasProperty("techMods") && file("libs/Mantle-1.20.1-1.11.117.jar").exists()) {
        // Tinkers' Construct 3 requires Mantle.
        runtimeOnly fg.deobf("libs:Mantle-1.20.1:1.11.117")
    }
    if (project.hasProperty("techMods") && file("libs/TConstruct-1.20.1-3.12.1.231.jar").exists()) {
        runtimeOnly fg.deobf("libs:TConstruct-1.20.1:3.12.1.231")
    }
    if (project.hasProperty("techMods") && file("libs/Tinkers-Thinking-0.2.4.jar").exists()) {
        // Tinkers' Thinking (TiT) brings Ardite / Chlorophyll ores; it needs TConstruct 3.12.1+.
        runtimeOnly fg.deobf("libs:Tinkers-Thinking:0.2.4")
    }
    if (project.hasProperty("techMods") && file("libs/guideme-20.1.15.jar").exists()) {
        // Applied Energistics 2's required library (GuideME 20.1.x for the 1.20.1 line).
        runtimeOnly fg.deobf("libs:guideme:20.1.15")
    }
    if (project.hasProperty("techMods") && file("libs/appliedenergistics2-forge-15.4.12.jar").exists()) {
        // AE2 15.x is the 1.20.1 Forge line; the prod jar must be deobf'd for the FG dev runtime.
        runtimeOnly fg.deobf("libs:appliedenergistics2-forge:15.4.12")
    }

    // Example mod dependency with JEI - using fg.deobf() ensures the dependency is remapped to your development mappings
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}-common-api:${jei_version}")
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}-forge-api:${jei_version}")
    // runtimeOnly fg.deobf("mezz.jei:jei-${mc_version}-forge:${jei_version}")

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation fg.deobf("blank:coolmod-${mc_version}:${coolmod_version}")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

    // Release hygiene: the datagen hash cache is bookkeeping, not content, and
    // the licence/third-party notices must travel with the jar.
    exclude '.cache/**'
    from(rootProject.file('LICENSE'))
    from(rootProject.file('THIRD-PARTY.md'))
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing:
// tasks.named('publish').configure {
//     dependsOn 'reobfJar'
// }

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs += ['-Xlint:deprecation']
}
