plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    maven { name = 'BMCLAPI'; url = uri('https://bmclapi2.bangbang93.com/maven/') }
    maven { name = 'Modrinth'; url = uri('https://api.modrinth.com/maven') }
    maven { name = 'BlameJared'; url = uri('https://maven.blamejared.com') }
    mavenCentral()
}

dependencies {
    // Jade HUD integration: compile-time only, never shipped.
    compileOnly "maven.modrinth:jade:${jade_version}"
    // JEI recipe display: compile-time only, never shipped. Modrinth's maven
    // serves the Fabric jar for this version, so use BlameJared's JEI maven.
    compileOnly "mezz.jei:jei-1.21.1-neoforge:${jei_version}"
    // KubeJS plugin API + Rhino: compile-time only. KubeJS reads
    // kubejs.plugins.txt from this jar at runtime, so neither is shipped.
    compileOnly "maven.modrinth:kubejs:${kubejs_version}"
    compileOnly "maven.modrinth:rhino:${rhino_version}"
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
        }
        data {
            data()
            programArguments.addAll '--mod', 'exnihilosatellitium', '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
    }

    mods {
        exnihilosatellitium {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// The client resource manager only exposes assets/. Mirror the data tables into
// assets/ so JEI can read them when the client is connected to a dedicated server
// (the data/ copy stays the single source of truth for server-side behaviour).
tasks.named('processResources', ProcessResources).configure {
    from('src/main/resources/data/exnihilosatellitium/sieve') {
        into 'assets/exnihilosatellitium/sieve'
    }
    from('src/main/resources/data/exnihilosatellitium/barrel') {
        into 'assets/exnihilosatellitium/barrel'
    }
    from('src/main/resources/data/exnihilosatellitium/compost') {
        into 'assets/exnihilosatellitium/compost'
    }
    from('src/main/resources/data/exnihilosatellitium/crucible_melt') {
        into 'assets/exnihilosatellitium/crucible_melt'
    }
    from('src/main/resources/data/exnihilosatellitium/crucible_heat') {
        into 'assets/exnihilosatellitium/crucible_heat'
    }
    from('src/main/resources/data/exnihilosatellitium/hammer') {
        into 'assets/exnihilosatellitium/hammer'
    }
    from('src/main/resources/data/exnihilosatellitium/crook') {
        into 'assets/exnihilosatellitium/crook'
    }

    // Release hygiene: the datagen hash cache is bookkeeping, not content, and
    // the licence/third-party notices must travel with the jar.
    exclude '.cache/**'
    from(rootProject.file('LICENSE'))
    from(rootProject.file('THIRD-PARTY.md'))
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
